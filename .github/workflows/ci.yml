name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax + architecture boundaries
        run: npm run check
      - name: Simulation, solver, fuzz, worker API, client tests
        run: npm test
      - name: Level packs (schema + solver verification)
        run: npm run validate:levels
      - name: Long fuzz
        run: node scripts/fuzz.js 5000
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://grillshuffle.thebuilder.work
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set: skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npm run build
      - name: D1 migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply grill-shuffle --remote
      - name: Deploy Worker + assets
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        run: |
          sleep 10
          curl -fsS https://grillshuffle.thebuilder.work/api/version
          curl -fsS -o /dev/null https://grillshuffle.thebuilder.work/
